# 鍥剧墖鑷姩鍘嬬缉宸ヤ綔娴?鈥?blog-img
# 瑙﹀彂锛氬悜 main 鍒嗘敮鎺ㄩ€?JPG/PNG 鏂囦欢鏃惰嚜鍔ㄨ浆涓?WebP
# =============================================================================

name: Compress Images to WebP

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "**/*.jpg"
      - "**/*.jpeg"
      - "**/*.png"

concurrency:
  group: compress-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compress:
    # 闃叉 github-actions[bot] 鐨勬彁浜ゅ啀娆¤Е鍙戯紝閬垮厤姝诲惊鐜?    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: pnpm install

      - name: Run image compression
        run: node scripts/compress-images.js
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          GITHUB_EVENT_AFTER: ${{ github.event.after }}

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 鏆傚瓨鎵€鏈夊彉鏇达紙鏂板 webp + 鍒犻櫎鍘熷浘锛?          git add -A

          if git diff --staged --quiet; then
            echo "鉁?娌℃湁鍙樻洿闇€瑕佹彁浜?
          else
            git commit -m "chore: auto compress images to webp"
            git push
            echo "馃殌 宸叉彁浜ゅ苟鎺ㄩ€?
          fi
